name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_harnesses:
        description: "Run the live coding-agent harnesses (Claude Code + kiro-cli). Requires secrets."
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: build + clippy + tests (unit, e2e, proptest, handcurated_schema).
  # Runs on every push and PR. Uploads release binaries for downstream jobs.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build --release
        run: cargo build --release --bins

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (unit + e2e + proptest + handcurated_schema)
        run: cargo test --all-targets

      - name: Upload release binaries for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: blazing-art-mcp-binaries
          path: |
            target/release/blazing_art_mcp
            target/release/build_goldset
            target/release/eval_goldset
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: gold-set retrieval eval (test pyramid layer 2).
  # Runs after build-and-test. Caches cloned reference repos under ~/.cache/.
  # Fails the build if `scripts/check_eval_threshold.sh` reports any metric
  # below `eval/threshold.json`.
  # ---------------------------------------------------------------------------
  eval:
    name: Gold-set retrieval eval
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (for the threshold-check script)
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo run --release --bin eval_goldset
        run: cargo run --release --bin eval_goldset -- --quiet

      - name: scripts/check_eval_threshold.sh
        run: bash scripts/check_eval_threshold.sh

      - name: Upload eval results JSON + Markdown
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.sha }}
          path: eval/results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3: live harness — Claude Code (test pyramid layer 3 part 1).
  # Manual trigger only (workflow_dispatch with run_harnesses=true), since it
  # makes real Anthropic API calls and costs $$.
  # ---------------------------------------------------------------------------
  harness-claude-code:
    name: Live harness (Claude Code)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_harnesses == true }}
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install claude-code CLI
        run: |
          # Anthropic publishes claude-code via npm. Adjust if upstream changes.
          curl -fsSL https://nodejs.org/dist/v20.19.0/node-v20.19.0-linux-x64.tar.xz \
            -o /tmp/node.tar.xz
          mkdir -p /usr/local/lib/node && tar -xJf /tmp/node.tar.xz -C /usr/local/lib/node --strip-components=1
          /usr/local/lib/node/bin/npm install -g @anthropic-ai/claude-code
          echo "/usr/local/lib/node/bin" >> $GITHUB_PATH

      - name: Cache cargo registry + target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Claude Code harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash tests/harness/run_claude_code.sh

      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-claude-code-transcripts
          path: tests/harness/transcripts/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 4: live harness — kiro-cli (test pyramid layer 3 part 2).
  # Same gating as Claude Code; mirrors the harness.
  # ---------------------------------------------------------------------------
  harness-kiro-cli:
    name: Live harness (kiro-cli)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_harnesses == true }}
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install kiro-cli
        # If kiro-cli isn't on a public registry that GHA can fetch from, point
        # this step at your internal artifact mirror. The harness skips
        # gracefully if `kiro-cli` isn't on PATH, so a missing binary does
        # not fail the workflow — it just no-ops.
        run: |
          if ! command -v kiro-cli >/dev/null 2>&1; then
            echo "::warning::kiro-cli not installable in CI; harness will skip."
          fi

      - name: Cache cargo registry + target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run kiro-cli harness
        run: bash tests/harness/run_kiro_cli.sh

      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-kiro-cli-transcripts
          path: tests/harness/transcripts/
          retention-days: 14
